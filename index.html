'use strict';const KEY='atelier-saveurs-v1';const $=s=>document.querySelector(s);const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>globalThis.crypto?.randomUUID?.()||'id-'+Date.now()+'-'+Math.random().toString(36).slice(2);const today=()=>new Date().toISOString().slice(0,10);const trialNames=['Goût','Texture','Arômes','Faisabilité','Cohérence du menu','Accord vin'];const trialKeys=['taste','texture','aroma','feasibility','menu','wine'];
// Optional recipe extensions: schema 1 and the original ingredient text are retained.
const YIELD_UNITS=['lot','portion','pièce','mg','g','kg','ml','cl','l'];
const INGREDIENT_UNITS=[...YIELD_UNITS,'c. à café','c. à soupe','pincée',''];
const TIME_KEYS=['preparation','cooking','resting','total'];
const TIME_LABELS={preparation:'Préparation active',cooking:'Cuisson',resting:'Repos',total:'Durée totale estimée'};
const cloneData=value=>JSON.parse(JSON.stringify(value));
const verdictLabel=status=>({to_improve:'À améliorer',validated:'Validé',rejected:'Rejeté'}[status]||status);
function inputError(message,field){const error=new Error(message);error.field=field;throw error}
function parseAmount(value,{nullable=false,zero=false,field}={}){
 const text=String(value??'').trim();
 if(text===''&&nullable)return null;
 if(!/^\d+(?:[.,]\d+)?(?:[eE][+-]?\d+)?$/.test(text))inputError('Saisissez un nombre valide (virgule ou point décimal).',field);
 const number=Number(text.replace(',','.'));
 if(!Number.isFinite(number)||(zero?number<0:number<=0))inputError(zero?'Saisissez une valeur positive ou zéro.':'Saisissez une quantité strictement positive.',field);
 return number;
}
function convertQuantity(value,from,to){
 if(!Number.isFinite(value)||value<=0)throw Error('Quantité invalide.');
 const units={mg:['mass',.001],g:['mass',1],kg:['mass',1000],ml:['volume',1],cl:['volume',10],l:['volume',1000]};
 let converted;
 if(from===to&&INGREDIENT_UNITS.includes(from)&&from!=='')converted=value;
 else if(Object.hasOwn(units,from)&&Object.hasOwn(units,to)&&units[from][0]===units[to][0])converted=value*(units[from][1]/units[to][1]);
 else throw Error('Unités incompatibles : utilisez la même unité ou une conversion de masse ou de volume.');
 if(!Number.isFinite(converted)||converted<=0)throw Error('Quantité trop grande ou trop petite pour le calcul.');
 return converted;
}
function batchFactor(formulation,targetYield){
 const factor=convertQuantity(targetYield.quantity,targetYield.unit,formulation.yield.unit)/formulation.yield.quantity;
 if(!Number.isFinite(factor)||factor<=0)throw Error('Rendement invalide pour le calcul.');
 return factor;
}
function calculateBatch(formulation,batch){
 const factor=batchFactor(formulation,batch.targetYield);
 const ingredients=formulation.ingredients.map(line=>{
  const adjusted=Object.hasOwn(batch.adjustments,line.id);
  const quantity=adjusted?batch.adjustments[line.id]:(line.quantity===null?null:line.quantity*factor);
  if(quantity!==null&&!line.unit)inputError('Renseignez une unité dans la recette avant de quantifier cet ingrédient.','t_adjust_'+line.id);
  if(quantity!==null&&(!Number.isFinite(quantity)||quantity<=0))throw Error('Quantité calculée invalide pour '+line.name+'.');
  return {...line,quantity,adjusted};
 });
 return {factor,ingredients};
}
function formatQuantity(number){
 if(number===null)return 'Au goût';
 return new Intl.NumberFormat('fr-FR',{maximumFractionDigits:3,...(number!==0&&Math.abs(number)<.001?{notation:'scientific'}:{})}).format(number);
}
function formatMinutes(value){
 if(value===null||value===undefined)return 'Non renseigné';
 const hours=Math.floor(value/60),minutes=value-hours*60;
 return hours?hours+' h'+(minutes?' '+formatQuantity(minutes)+' min':''):formatQuantity(minutes)+' min';
}
function timeSummary(times){
 if(times?.total!==null&&times?.total!==undefined)return formatMinutes(times.total);
 if(times&&['preparation','cooking','resting'].every(k=>typeof times[k]==='number')){
  const sum=times.preparation+times.cooking+times.resting;
  return Number.isFinite(sum)?formatMinutes(sum)+' — Somme des durées, hors chevauchements':'Non renseigné';
 }
 return 'Non renseigné';
}
function validateExtensions(data){
 const object=x=>x&&typeof x==='object'&&!Array.isArray(x);
 const positive=x=>typeof x==='number'&&Number.isFinite(x)&&x>0;
 const fail=message=>{throw Error('Données de quantité ou de durée invalides : '+message)};
 function validateTimes(times){if(!object(times)||TIME_KEYS.some(k=>times[k]!==null&&!(typeof times[k]==='number'&&Number.isFinite(times[k])&&times[k]>=0)))fail('temps estimés')}
 function validateFormulation(form){
  if(!object(form)||!object(form.yield)||!positive(form.yield.quantity)||!YIELD_UNITS.includes(form.yield.unit)||!Array.isArray(form.ingredients)||!form.ingredients.length)fail('rendement et ingrédients requis');
  const seen=new Set();
  for(const line of form.ingredients){
   if(!object(line)||typeof line.id!=='string'||!/^[A-Za-z0-9_-]{1,128}$/.test(line.id)||seen.has(line.id)||typeof line.name!=='string'||!line.name.trim()||typeof line.note!=='string'||!INGREDIENT_UNITS.includes(line.unit)||(line.quantity!==null&&!positive(line.quantity))||(line.quantity!==null&&line.unit===''))fail('ligne d’ingrédient');
   seen.add(line.id);
  }
 }
 for(const recipe of data.recipes){if(recipe.formulation!==undefined)validateFormulation(recipe.formulation);if(recipe.estimatedMinutes!==undefined)validateTimes(recipe.estimatedMinutes)}
 for(const trial of data.trials){
  if(trial.estimatedMinutes!==undefined)validateTimes(trial.estimatedMinutes);
  if(trial.snapshot?.estimatedMinutes!==undefined)validateTimes(trial.snapshot.estimatedMinutes);
  if(trial.snapshot?.formulation!==undefined)validateFormulation(trial.snapshot.formulation);
  if(trial.batch!==undefined){
   const batch=trial.batch,form=trial.snapshot?.formulation;
   if(!form||!object(batch)||!object(batch.targetYield)||!positive(batch.targetYield.quantity)||!YIELD_UNITS.includes(batch.targetYield.unit)||!object(batch.adjustments))fail('quantité cible');
   const ids=new Set(form.ingredients.map(line=>line.id));
   if(Object.entries(batch.adjustments).some(([id,quantity])=>!ids.has(id)||(quantity!==null&&!positive(quantity))))fail('ajustement manuel');
   calculateBatch(form,batch);
  }else if(trial.snapshot?.formulation!==undefined)fail('quantité cible absente');
 }
 return data;
}

function numberInput(value){return value===null||value===undefined?'':String(value).replace('.',',')}
function inlineError(id){return `<span id="${id}_error" class="field-error hidden" role="alert"></span>`}
function amountField(id,label,value,{optional=false,zero=false}={}){

}
function unitSelect(id,value,units,label='Unité'){

}
function clearFormErrors(){document.querySelectorAll('.field-error').forEach(el=>{el.textContent='';el.classList.add('hidden')});document.querySelectorAll('[aria-invalid="true"]').forEach(el=>el.removeAttribute('aria-invalid'))}
function showFormError(error){

function readAmount(id,options={}){return parseAmount($('#'+id).value,{...options,field:id})}

 return `<section class="card section"><h2>Temps estimés</h2><p class="muted small">En minutes. Laissez vide si inconnu ; zéro signifie aucune durée. Le total peut tenir compte d’opérations simultanées.</p><div class="grid two">${TIME_KEYS.map(k=>amountField(prefix+'_time_'+k,TIME_LABELS[k]+' (min)',times?.[k],{optional:true,zero:true})).join('')}</div><p class="help">Les durées ne sont pas multipliées par le coefficient de quantité.</p></section>`;
}
function gatherTimes(prefix){return Object.fromEntries(TIME_KEYS.map(k=>[k,readAmount(prefix+'_time_'+k,{nullable:true,zero:true})]))}

 if(!times)return '';
 return `<section class="card section"><h2>Temps estimés</h2><p class="time-summary">${escapeHtml(timeSummary(times))}</p><dl class="time-details">${TIME_KEYS.filter(k=>k!=='total').map(k=>`<div><dt>${TIME_LABELS[k]}</dt><dd>${escapeHtml(formatMinutes(times[k]))}</dd></div>`).join('')}</dl></section>`;
}
function ingredientList(lines){

function formulationEditor(){
 const form=recipeDraft.formulation;
 if(!form)return `<h2>Quantités paramétriques</h2><p class="muted small">La liste d’origine reste conservée. Pour calculer un lot réduit, ajoutez un rendement et une ligne par ingrédient.</p><p class="help">Avant la première activation, exportez votre sauvegarde JSON depuis Sauvegardes. Aucune conversion automatique de la liste existante n’est effectuée.</p>${btn('Activer les quantités paramétriques','enableFormulation')}`;

 const prefix='r_i_'+line.id;
 return `<fieldset class="ingredient-row" data-line-id="${line.id}"><legend>Ingrédient ${index+1}</legend><div class="ingredient-fields"><div class="field ingredient-name"><label for="${prefix}_name">Ingrédient</label><input id="${prefix}_name" data-field="name" value="${escapeHtml(line.name)}" aria-describedby="${prefix}_name_error">${inlineError(prefix+'_name')}</div><div class="field"><label for="${prefix}_quantity">Quantité</label><input id="${prefix}_quantity" data-field="quantity" type="text" inputmode="decimal" value="${escapeHtml(numberInput(line.quantity))}" aria-describedby="${prefix}_quantity_error">${inlineError(prefix+'_quantity')}</div><div class="field"><label for="${prefix}_unit">Unité</label><select id="${prefix}_unit" data-field="unit">${INGREDIENT_UNITS.map(unit=>`<option value="${escapeHtml(unit)}" ${unit===line.unit?'selected':''}>${escapeHtml(unit||'Sans unité')}</option>`).join('')}</select></div><div class="field ingredient-note"><label for="${prefix}_note">Remarque</label><input id="${prefix}_note" data-field="note" value="${escapeHtml(line.note)}"></div></div><div class="buttons ingredient-actions">${btn('Retirer cet ingrédient','removeIngredient:'+line.id)}</div></fieldset>`;

}
function captureFormulation(strict){
 const form=recipeDraft.formulation;if(!form)return;
 form.yield={quantity:strict?readAmount('r_yield_quantity'):$('#r_yield_quantity').value,unit:$('#r_yield_unit').value};
 form.ingredients=form.ingredients.map(line=>{
  const prefix='r_i_'+line.id,name=$('#'+prefix+'_name').value.trim(),unit=$('#'+prefix+'_unit').value;

 return header('EXPÉRIMENTATIONS','Plans de test','Préparations distinctes et dégustations comparées.',btn('+ Nouveau plan','newPlan','primary'))+`<div class="card"><h2>Commencer avec le dessert</h2><p>Deux chocolats, deux niveaux de sucre et la présence de tuile : cinq préparations partagées dans quatre dégustations. Les recettes sources et les ajouts sont vérifiés avant création.</p>${btn('Créer le plan dessert','dessertSetup')}</div><div class="section list">${plansOf(db).map(p=>`<div class="item"><div><strong>${escapeHtml(p.name)}</strong><span class="pill">${planStateLabel(p.status)}</span><p class="muted small">${escapeHtml(projectName(p.projectId))} · ${p.preparations.filter(x=>x.trialId).length}/${p.preparations.length} préparations · ${p.tastings.filter(t=>t.status==='completed').length}/${p.tastings.length} dégustations réalisées</p></div>${btn('Ouvrir','openPlan:'+p.id)}</div>`).join('')||'<div class="empty">Aucun plan. Créez votre comparaison à partir des recettes du carnet.</div>'}</div>`;

function dessertSetupView(){

 return header('MODÈLE DESSERT','Choisir les sources','Les recettes originales resteront conservées.')+`<div class="focus card">${projectSelect('dessert_project',db.projects[0]?.id)}<div class="field"><label for="dessert_cream">Source de la namelaka</label><select id="dessert_cream">${recipeOptions(cream?.id)}</select></div><div class="field"><label for="dessert_fruit">Source des griottes et de la tuile</label><select id="dessert_fruit">${recipeOptions(fruit?.id)}</select></div><p class="help">L’aperçu présentera deux nouvelles fiches élémentaires, les variantes et la matrice. La formule de tuile devra être complétée avant réalisation. Aucun ajout au carnet avant validation.</p><div class="buttons">${btn('Prévisualiser le plan','previewDessert','primary')}${btn('Annuler','nav:plans')}</div></div>`;
}
function dessertPreviewView(){
 if(!dessertDraft)return dessertSetupView();const plan=dessertDraft.plan;
 return header('AVANT ENREGISTREMENT','Vérifier le plan dessert','5 préparations distinctes · 4 dégustations · 8 combinaisons théoriques')+`<div class="focus"><section class="card"><h2>Recettes et sauvegarde</h2><p>Sources confirmées : ${plan.sourceIds.map(id=>escapeHtml(recipeName(id))).join(' ; ')}.</p><p>Deux fiches seront ajoutées : Griottes tièdes — élément et Tuile cacao — élément. Leurs sources composées restent inchangées.</p><p class="help">La tuile est incomplète : précisez sa formule et ses quantités avant de lancer son essai. Les dégustations sans tuile pourront avancer séparément.</p></section>${dessertDraft.recipes.map(r=>`<section class="card section"><h2>Nouvelle fiche : ${escapeHtml(r.name)}</h2>${formulationDetails(r.formulation)}<h3>Procédure à vérifier</h3><ol>${r.steps.map(step=>`<li>${escapeHtml(step)}</li>`).join('')}</ol></section>`).join('')}${plan.components.map(c=>`<section class="card section"><h2>${escapeHtml(c.name)}</h2>${c.variants.map(v=>`<p><strong>${escapeHtml(v.name)}</strong> — ${escapeHtml(v.changes||(!v.included?'Aucune préparation':'Formule à préciser'))}</p>`).join('')}</section>`).join('')}<section class="card section"><h2>Les quatre dégustations</h2>${tastingMatrix(plan)}<p class="small muted">Le modèle initial couvre les paires. Cette première version n’est pas un optimiseur général ; les interactions à trois éléments restent à confirmer.</p></section><p class="help">La création télécharge d’abord votre sauvegarde JSON actuelle, puis enregistre les deux recettes et le plan en une seule écriture.</p><div class="buttons form-actions">${btn('Sauvegarder et créer le plan','saveDessert','primary')}${btn('Revoir les sources','dessertSetup')}${btn('Annuler','nav:plans')}</div></div>`;
}
function tastingMatrix(plan){
 return `<div class="compare plan-comparison" tabindex="0" aria-label="Tableau comparatif des dégustations"><table><thead><tr><th>Dégustation</th>${plan.components.map(c=>`<th>${escapeHtml(c.name)}</th>`).join('')}<th>État</th><th>Verdict</th>${plan.criteria.map(c=>`<th>${escapeHtml(c.name)}</th>`).join('')}<th>Observations</th></tr></thead><tbody>${plan.tastings.map(t=>`<tr><td>${escapeHtml(t.name)}</td>${plan.components.map(c=>{const s=t.selections.find(s=>s.componentId===c.id),v=c.variants.find(v=>v.id===s?.variantId),p=plan.preparations.find(p=>p.id===s?.preparationId);return `<td>${v?escapeHtml(v.name):'Non testé'}${p?'<br><span class="muted small">'+escapeHtml(p.name)+'</span>':''}</td>`}).join('')}<td>${planStateLabel(t.status)}</td><td>${t.verdict==='pending'?'À évaluer':escapeHtml(verdictLabel(t.verdict))}</td>${plan.criteria.map(c=>`<td>${t.scores[c.id]===null?'Non évalué':formatQuantity(t.scores[c.id])+'/10'}</td>`).join('')}<td>${escapeHtml(t.observations||'—')}</td></tr>`).join('')}</tbody></table></div>`;
}
function planView(){

ponent:'+c.id)}${btn('Retirer le composant','removePlanComponent:'+c.id)}</div>`:''}</div>`).join('')||'<div class="empty">Ajoutez une recette pour créer le premier composant.</div>'}${active?`<div class="card"><div class="field"><label for="plan_recipe_source">Recette à ajouter</label><select id="plan_recipe_source">${recipeOptions()}</select></div>${btn('+ Ajouter un composant','addPlanComponent')}</div>`:''}</section><section class="section"><div class="row"><h2>Lots à préparer</h2></div><div class="list">${plan.preparations.map(p=>`<div class="card"><h3>${escapeHtml(p.name)}</h3><p class="small muted">${p.trialId?'Réalisé — essai enregistré':p.targetYield?formatQuantity(p.targetYield.quantity)+' '+escapeHtml(p.targetYield.unit)+' · À préparer':'Ingrédients à compléter'}</p><div class="buttons">${p.trialId?btn('Consulter l’essai','trial:'+p.trialId):active?btn('Démarrer cette préparation','startPreparation:'+p.id,'primary'):''}${active&&!p.trialId?btn('Quantité et libellé','editPreparation:'+p.id):''}${active?btn('Nouveau lot de cette variante','copyPreparation:'+p.id):''}${active&&!p.trialId?btn('Retirer le lot','removePreparation:'+p.id):''}</div></div>`).join('')||'<div class="empty">Choisissez une variante incluse puis « Préparer un lot ».</div>'}</div></section><section class="section"><div class="row"><h2>Dégustations</h2><div class="buttons">${btn('Comparer','comparePlan')}${active?btn('+ Dégustation','newTasting'):''}</div></div><div class="list">${plan.tastings.map(t=>`<div class="item"><div><strong>${escapeHtml(t.name)}</strong><span class="pill">${planStateLabel(t.status)}</span><p class="muted small">${t.selections.map(s=>{const c=plan.components.find(c=>c.id===s.componentId),v=c.variants.find(v=>v.id===s.variantId);return escapeHtml(c.name+' : '+v.name)}).join(' · ')||'Assemblage à choisir'}</p></div><div class="buttons">${active?btn(t.status==='completed'?'Corriger l’évaluation':'Composition et évaluation','editTasting:'+t.id):''}${active?btn('Nouvelle dégustation similaire','copyTasting:'+t.id):''}${active&&t.status!=='completed'?btn('Retirer','removeTasting:'+t.id):''}</div></div>`).join('')||'<div class="empty">Aucune dégustation prévue.</div>'}</div></section><section class="card section"><h2>Conclusion</h2><p style="white-space:pre-wrap">${escapeHtml(plan.conclusion||'À renseigner après comparaison.')}</p><div class="buttons">${btn('Exporter le plan Markdown','exportPlan')}${btn('Dupliquer le plan sans résultats','duplicatePlan')}${active?btn('Archiver le plan','archivePlan'):''}</div></section>`;
}
function planInfoForm(){
 const plan=planInfoDraft.plan,locked=plan.tastings.some(t=>t.status==='completed'||Object.values(t.scores).some(n=>n!==null));
 return header('PLAN DE TEST',planInfoDraft.isNew?'Nouveau plan':plan.name)+`<div class="focus card">${textField('plan_name','Nom du plan',plan.name)}${projectSelect('plan_project',plan.projectId)}${textField('plan_objective','Objectif',plan.objective,true)}${textField('plan_hypothesis','Hypothèses',plan.hypothesis,true)}${textField('plan_conditions','Conditions communes',plan.conditions,true)}${textField('plan_criteria','Critères — un par ligne',plan.criteria.map(c=>c.name).join('\n'),true)}${locked?'<p class="help">Les critères sont déjà utilisés dans une évaluation : ils restent conservés. Dupliquez le plan pour une autre grille.</p>':''}${textField('plan_conclusion','Conclusion et prochaine hypothèse',plan.conclusion,true)}<div class="buttons">${btn('Enregistrer le plan','savePlanInfo','primary')}${btn('Annuler',planInfoDraft.isNew?'nav:plans':'openPlan:'+plan.id)}</div></div>`;

function savePlanInfo(){
 clearFormErrors();const draft=cloneData(planInfoDraft.plan);draft.name=$('#plan_name').value.trim();if(!draft.name)inputError('Indiquez le nom du plan.','plan_name');
 const names=$('#plan_criteria').value.split('\n').map(v=>v.trim()).filter(Boolean);if(!names.length||new Set(names).size!==names.length)inputError('Renseignez des critères distincts, un par ligne.','plan_criteria');
 const oldNames=draft.criteria.map(c=>c.name);if(JSON.stringify(names)!==JSON.stringify(oldNames)){
  if(draft.tastings.some(t=>t.status==='completed'||Object.values(t.scores).some(n=>n!==null)))inputError('Les critères déjà notés restent conservés. Dupliquez le plan.','plan_criteria');
  draft.criteria=names.map(name=>draft.criteria.find(c=>c.name===name)||newCriterion(name));draft.tastings.forEach(t=>t.scores=Object.fromEntries(draft.criteria.map(c=>[c.id,t.scores[c.id]??null])));
 }
 draft.projectId=$('#plan_project').value;for(const key of ['objective','hypothesis','conditions','conclusion'])draft[key]=$('#plan_'+key).value;draft.updatedAt=today();
 const next=cloneData(db);next.testPlans=plansOf(next);if(planInfoDraft.isNew)next.testPlans.push(draft);else{if(selectedTestPlan().status==='archived')throw Error('Plan archivé.');next.testPlans[next.testPlans.findIndex(p=>p.id===draft.id)]=draft}
 if(save(next)){planInfoDraft=null;openTestPlan(draft.id)}
}
function assertVariantEditable(plan,componentId,variantId){
 if(plan.status==='archived'||plan.preparations.some(p=>p.componentId===componentId&&p.variantId===variantId&&p.trialId)||plan.tastings.some(t=>t.status==='completed'&&t.selections.some(s=>s.componentId===componentId&&s.variantId===variantId)))throw Error('Cette variante est déjà utilisée. Ajoutez une nouvelle variante pour un autre essai.');
}
function planVariantForm(){
 const plan=selectedTestPlan(),c=plan.components.find(c=>c.id===variantDraft.componentId),v=variantDraft.variant,effective=v.included?materializeVariant(c,v):cloneData(c.reference);
 return header('VARIANTE DU PLAN',c.name,'Les adaptations ne modifient pas la recette source.')+`<div class="focus card">${textField('variant_name','Nom de la variante',v.name)}<label class="check"><input type="checkbox" id="variant_included" ${v.included?'checked':''}> Composant inclus (décocher pour une variante absente)</label><div id="variant_details" ${v.included?'':'class="hidden"'}>${textField('variant_changes','Modifications et consignes à tester',v.changes,true)}${effective.formulation?`<div class="grid two">${amountField('variant_yield_quantity','Rendement cible par défaut',v.targetYield?.quantity??effective.formulation.yield.quantity)}${unitSelect('variant_yield_unit',v.targetYield?.unit||effective.formulation.yield.unit,YIELD_UNITS)}</div><p class="help">Les quantités ci-dessous sont celles de la référence. Le rendement cible ajuste le lot. Complétez les ingrédients incertains ; seuls les ingrédients explicitement « au goût » peuvent rester non chiffrés lors de la réalisation.</p>${effective.formulation.ingredients.map(line=>`<fieldset class="ingredient-row variant-ingredient" data-ingredient-id="${line.id}"><legend>Ingrédient adapté</legend>${textField('pv_'+line.id+'_name','Ingrédient',line.name)}<div class="grid two"><div data-field-wrap="quantity">${amountField('pv_'+line.id+'_quantity','Quantité de référence',line.quantity,{optional:true})}</div><div data-field-wrap="unit">${unitSelect('pv_'+line.id+'_unit',line.unit,INGREDIENT_UNITS)}</div></div>${textField('pv_'+line.id+'_note','Remarque',line.note)}</fieldset>`).join('')}`:'<p class="help">Cette référence est en liste libre. Complétez sa recette, puis actualisez explicitement le composant avant de lancer une préparation.</p>'}</div><div class="buttons section">${btn('Enregistrer la variante','savePlanVariant','primary')}${btn('Annuler','openPlan:'+plan.id)}</div></div>`;
}
function savePlanVariant(){
 clearFormErrors();const plan=selectedTestPlan(),c=plan.components.find(c=>c.id===variantDraft.componentId),v=cloneData(variantDraft.variant);v.name=$('#variant_name').value.trim();if(!v.name)inputError('Nommez la variante.','variant_name');v.included=$('#variant_included').checked;v.changes=$('#variant_changes')?.value||'';v.ingredientEdits=[];v.targetYield=null;
 if(v.included&&c.reference.formulation){
  v.targetYield={quantity:readAmount('variant_yield_quantity'),unit:$('#variant_yield_unit').value};
  for(const line of c.reference.formulation.ingredients){const prefix='pv_'+line.id;const name=$('#'+prefix+'_name').value.trim();if(!name)inputError('Renseignez l’ingrédient.',prefix+'_name');const quantity=readAmount(prefix+'_quantity',{nullable:true}),unit=$('#'+prefix+'_unit').value;if(quantity!==null&&!unit)inputError('Choisissez une unité.',prefix+'_quantity');v.ingredientEdits.push({ingredientId:line.id,name,quantity,unit,note:$('#'+prefix+'_note').value})}
 }
 const isNew=variantDraft.isNew;
 if(savePlanMutation(p=>{const component=p.components.find(c=>c.id===variantDraft.componentId);if(isNew)component.variants.push(v);else{assertVariantEditable(p,component.id,v.id);component.variants[component.variants.findIndex(x=>x.id===v.id)]=v;if(!v.included&&p.preparations.some(prep=>prep.variantId===v.id))throw Error('Retirez d’abord les lots inutilisés de cette variante.')}}))variantDraft=null;
}
function preparationForm(){
 const prep=preparationDraft,plan=selectedTestPlan(),c=plan.components.find(c=>c.id===prep.componentId),v=c.variants.find(v=>v.id===prep.variantId),recipe=materializeVariant(c,v);
 return header('PRÉPARATION',prep.name)+`<div class="focus card">${textField('preparation_name','Libellé du lot',prep.name)}${recipe.formulation?`<div class="grid two">${amountField('preparation_quantity','Rendement cible',prep.targetYield.quantity)}${unitSelect('preparation_unit',prep.targetYield.unit,YIELD_UNITS)}</div>${formulationDetails(recipe.formulation)}`:'<p>Complétez la recette source et actualisez sa référence.</p>'}<div class="buttons">${btn('Enregistrer le lot','savePreparation','primary')}${btn('Annuler','openPlan:'+plan.id)}</div></div>`;
}
function tastingForm(){
 const plan=selectedTestPlan(),t=tastingDraft,locked=tastingDraft.originalStatus==='completed';
 return header('DÉGUSTATION',t.name,'Évaluation de l’assemblage, distincte des notes de chaque préparation.')+`<div class="focus card">${textField('tasting_name','Nom de la dégustation',t.name)}<h2>Assemblage</h2>${t.repeated?'<p class="help">Cette dégustation réutilise les lots sélectionnés. Pour confirmer sur un nouveau lot, dupliquez sa préparation puis sélectionnez ce nouveau lot.</p>':''}${locked?'<p class="help">Cet assemblage a été réalisé : sa composition est conservée. Ajoutez une dégustation pour un autre assemblage.</p>':''}${plan.components.map(c=>{const s=t.selections.find(s=>s.componentId===c.id),selected=s?.preparationId?'prep:'+s.preparationId:s?'abs:'+s.variantId:'';return `<div class="field"><label for="tasting_select_${c.id}">${escapeHtml(c.name)}</label><select id="tasting_select_${c.id}" data-tasting-component="${c.id}" ${locked?'disabled':''}><option value="">Non testé dans cette dégustation</option>${c.variants.filter(v=>!v.included).map(v=>`<option value="abs:${v.id}" ${selected==='abs:'+v.id?'selected':''}>${escapeHtml(v.name)}</option>`).join('')}${plan.preparations.filter(p=>p.componentId===c.id).map(p=>`<option value="prep:${p.id}" ${selected==='prep:'+p.id?'selected':''}>${escapeHtml(p.name)} — ${p.trialId?'Réalisé':'À préparer'}</option>`).join('')}</select></div>`}).join('')}<h2>Réalisation et résultat</h2><div class="grid two"><div class="field"><label for="tasting_status">État</label><select id="tasting_status" ${locked?'disabled':''}>${['planned','completed','skipped'].map(s=>`<option value="${s}" ${t.status===s?'selected':''}>${planStateLabel(s)}</option>`).join('')}</select></div><div class="field"><label for="tasting_date">Date</label><input id="tasting_date" type="date" value="${escapeHtml(t.date||today())}">${inlineError('tasting_date')}</div></div><p class="help">Notes de 0 à 10 ; vide = non évalué. Pour amertume et acidité, 10 signifie « équilibre souhaité », pas intensité maximale.</p>${plan.criteria.map(c=>`<div data-score-wrap="${c.id}">${amountField('tasting_score_'+c.id,escapeHtml(c.name),t.scores[c.id],{optional:true,zero:true})}</div>`).join('')}${textField('tasting_observations','Observations de l’assemblage',t.observations,true)}<div class="field"><label for="tasting_verdict">Verdict</label><select id="tasting_verdict">${['pending','to_improve','validated','rejected'].map(v=>`<option value="${v}" ${t.verdict===v?'selected':''}>${v==='pending'?'À évaluer':verdictLabel(v)}</option>`).join('')}</select></div><div class="buttons">${btn('Enregistrer la dégustation','saveTasting','primary')}${btn('Annuler','openPlan:'+plan.id)}</div></div>`;
}
function saveTasting(){
 clearFormErrors();const t=cloneData(tastingDraft);delete t.isNew;delete t.originalStatus;delete t.repeated;t.name=$('#tasting_name').value.trim();if(!t.name)inputError('Nommez la dégustation.','tasting_name');
 const plan=selectedTestPlan();if(tastingDraft.originalStatus!=='completed')t.selections=plan.components.flatMap(c=>{const value=$('#tasting_select_'+c.id).value;if(!value)return [];const [type,id]=value.split(':');if(type==='abs')return [{componentId:c.id,variantId:id,preparationId:null}];const prep=plan.preparations.find(p=>p.id===id);if(!prep)throw Error('Lot introuvable.');return [{componentId:c.id,variantId:prep.variantId,preparationId:prep.id}]});
 if(!t.selections.some(s=>s.preparationId))throw Error('Choisissez au moins un lot pour la dégustation.');
 t.status=tastingDraft.originalStatus==='completed'?'completed':$('#tasting_status').value;t.date=$('#tasting_date').value;t.observations=$('#tasting_observations').value;t.verdict=$('#tasting_verdict').value;
 t.scores=Object.fromEntries(plan.criteria.map(c=>{const value=readAmount('tasting_score_'+c.id,{nullable:true,zero:true});if(value!==null&&value>10)inputError('La note doit être comprise entre 0 et 10.','tasting_score_'+c.id);return [c.id,value]}));
 if(t.status==='completed'){if(!t.date)inputError('Renseignez la date de réalisation.','tasting_date');assertTastingReady(db,plan,t)}
 if(savePlanMutation(p=>{if(tastingDraft.isNew)p.tastings.push(t);else p.tastings[p.tastings.findIndex(x=>x.id===t.id)]=t}))tastingDraft=null;
}
function planCompareView(){const plan=selectedTestPlan();return header('COMPARAISON',plan.name,'Les notes inconnues restent distinctes de zéro.',btn('Retour au plan','openPlan:'+plan.id))+`<div class="card">${tastingMatrix(plan)}</div><p class="help">Aucun classement global ou moyenne n’est imposé. Comparez les critères, les conditions et les observations, puis confirmez sur un nouveau lot.</p>`}
function handlePlanAction(verb,id){
 const parts=id.split(':');
 if(verb==='openPlan'){openTestPlan(id)}
 else if(verb==='newPlan'){if(!db.projects.length)throw Error('Créez d’abord un projet.');planInfoDraft={plan:createPlan({projectId:db.projects[0].id}),isNew:true};view='planInfo';render()}
 else if(verb==='editPlanInfo'){planInfoDraft={plan:cloneData(selectedTestPlan()),isNew:false};view='planInfo';render();if(planInfoDraft.plan.tastings.some(t=>t.status==='completed'||Object.values(t.scores).some(n=>n!==null)))$('#plan_criteria').readOnly=true}
 else if(verb==='savePlanInfo')savePlanInfo();
 else if(verb==='dessertSetup'){view='dessertSetup';render()}
 else if(verb==='previewDessert'){dessertDraft=buildDessertPlan(db,{projectId:$('#dessert_project').value,namelakaId:$('#dessert_cream').value,griottesId:$('#dessert_fruit').value});const check=cloneData(db);check.recipes.push(...dessertDraft.recipes);check.testPlans=[...plansOf(check),dessertDraft.plan];validateData(check);view='dessertPreview';render()}
 else if(verb==='saveDessert'){if(view!=='dessertPreview'||!dessertDraft)return true;const next=cloneData(db);next.recipes.push(...dessertDraft.recipes);next.testPlans=[...plansOf(next),dessertDraft.plan];download('atelier-saveurs-avant-plan-'+today()+'.json',JSON.stringify(db,null,2),'application/json');if(save(next)){const planId=dessertDraft.plan.id;dessertDraft=null;openTestPlan(planId)}}
 else if(verb==='addPlanComponent'){const source=db.recipes.find(r=>r.id===$('#plan_recipe_source').value);if(!source)throw Error('Choisissez une recette.');savePlanMutation(p=>addPlanComponent(p,source))}

function convertIngredients(recipe){
 const seedIndex=seedRecipes.findIndex(seed=>seed[0]===recipe.name&&seed[3]===recipe.ingredients&&JSON.stringify(seed[4])===JSON.stringify(recipe.steps));
 if(seedIndex>=0)return cloneData(seedFormulations[seedIndex]);
 const ingredients=recipe.ingredients.split(/\r?\n/).map(line=>line.trim()).filter(Boolean).map((line,index)=>{
  const match=line.match(/^(\d+(?:[.,]\d+)?)(?:\s*[–-]\s*(\d+(?:[.,]\d+)?))?\s*(kg|mg|g|ml|cl|l)\s+(.+)$/i);
  // Compound quantities and expressions we cannot interpret remain explicit free text.
  if(match&&!/\d+(?:[.,]\d+)?\s*(?:kg|mg|g|ml|cl|l)\b/i.test(match[4])){
   const quantity=Number(match[1].replace(',','.')),upper=match[2]&&Number(match[2].replace(',','.'));
   if(quantity>0&&Number.isFinite(quantity)&&(!match[2]||(Number.isFinite(upper)&&upper>=quantity)))return {id:uid(),name:match[4],quantity,unit:match[3].toLowerCase(),note:match[2]?'Référence : '+match[1]+'–'+match[2]+' '+match[3]+'. Calcul sur la borne basse ; ajuster.':''};
  }
  return {id:uid(),name:line,quantity:null,unit:'',note:'Quantité à préciser ; ligne originale conservée sans interprétation.'};
 });
 if(!ingredients.length)ingredients.push({id:uid(),name:'Ingrédients à renseigner',quantity:null,unit:'',note:'La liste d’origine était vide.'});
 return {yield:{quantity:1,unit:'lot'},ingredients};
}

function validateData(d){
 const fail=()=>{throw Error('Format de sauvegarde invalide : données ou références incohérentes.')};
 const obj=x=>x&&typeof x==='object'&&!Array.isArray(x);
 const text=(x,keys)=>keys.every(k=>typeof x[k]==='string');
 const id=x=>typeof x==='string'&&/^[A-Za-z0-9_-]{1,128}$/.test(x);
 const steps=x=>Array.isArray(x)&&x.every(v=>typeof v==='string');
 const date=x=>typeof x==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(x)&&!Number.isNaN(Date.parse(x));
 if(!obj(d)||d.schema!==1||!['projects','recipes','trials'].every(k=>Array.isArray(d[k])))fail();
 const ids={};for(const group of ['projects','recipes','trials']){ids[group]=new Set();for(const x of d[group]){if(!obj(x)||!id(x.id)||ids[group].has(x.id))fail();ids[group].add(x.id)}}
 for(const p of d.projects)if(!text(p,['name','description','createdAt'])||!p.name.trim()||!date(p.createdAt))fail();
 for(const r of d.recipes)if(!text(r,['name','category','goal','ingredients','measures','variants','createdAt'])||!r.name.trim()||!ids.projects.has(r.projectId)||!steps(r.steps)||!date(r.createdAt))fail();
 for(const t of d.trials){
  if(!ids.recipes.has(t.recipeId)||!text(t,['version','date','createdAt','change','measurements','observations','next','status'])||!t.version.trim()||!date(t.date)||Number.isNaN(Date.parse(t.createdAt))||!['to_improve','validated','rejected'].includes(t.status)||!obj(t.scores)||typeof t.wineTested!=='boolean'||!Array.isArray(t.checked))fail();
  if(Object.entries(t.scores).some(([k,v])=>!trialKeys.includes(k)||typeof v!=='number'||!Number.isFinite(v)||v<0||v>10))fail();
  if(t.snapshot!==undefined&&(!obj(t.snapshot)||!text(t.snapshot,['name','ingredients','goal'])||!steps(t.snapshot.steps)))fail();
  if(t.checked.some(v=>!Number.isInteger(v)||v<0||(t.snapshot&&v>=t.snapshot.steps.length)))fail();
 }
 validateExtensions(d);
 validateTestPlans(d);
 return d;
}

function home(){const total=db.trials.length,done=db.trials.filter(x=>x.status==='validated').length;const recent=[...db.trials].sort((a,b)=>b.createdAt.localeCompare(a.createdAt)).slice(0,4);return header('TABLEAU DE BORD','Mes essais culinaires','Des recettes, des versions et des observations conservées au même endroit.',btn('+ Nouvelle recette','newRecipe','primary'))+conversionNotice()+`<div class="grid"><div class="card"><div class="muted small">Recettes</div><div class="stat">${db.recipes.length}</div></div><div class="card"><div class="muted small">Essais enregistrés</div><div class="stat">${total}</div></div><div class="card"><div class="muted small">Essais validés</div><div class="stat">${done}</div></div></div><div class="section"><div class="row"><h2>Projets</h2>${btn('+ Projet','newProject')}</div><div class="grid two">${db.projects.map(p=>`<div class="card"><h3>${escapeHtml(p.name)}</h3><p class="muted small">${db.recipes.filter(r=>r.projectId===p.id).length} recettes</p>${btn('Voir les recettes','project:'+p.id)}</div>`).join('')||'<div class="empty">Aucun projet</div>'}</div></div><div class="section"><div class="row"><h2>Derniers essais</h2>${btn('Voir tout','nav:history')}</div>${recent.length?`<div class="list">${recent.map(t=>`<div class="item"><div><strong>${escapeHtml(recipeName(t.recipeId))} <span class="pill">${escapeHtml(t.version)}</span></strong><span class="muted small">${fmtDate(t.date)} · ${escapeHtml(verdictLabel(t.status))}</span></div>${btn('Consulter','trial:'+t.id)}</div>`).join('')}</div>`:'<div class="empty">Aucun essai pour le moment. Ouvre une recette pour commencer.</div>'}</div><div class="help">🎙️ Sur Android, tu peux dicter dans les zones de texte avec le microphone du clavier. Un bouton de reconnaissance vocale est aussi proposé si le navigateur le permet.</div>`}
function recipes(){const filtered=db.recipes.filter(r=>activeProject==='all'||r.projectId===activeProject);return header('BIBLIOTHÈQUE','Mes recettes',`${db.recipes.length} recettes · fiches de référence indépendantes des essais`,btn('+ Nouvelle recette','newRecipe','primary'))+`<div class="field" style="max-width:380px"><label>Filtrer par projet</label><select id="projectFilter"><option value="all">Tous les projets</option>${db.projects.map(p=>`<option value="${p.id}" ${activeProject===p.id?'selected':''}>${escapeHtml(p.name)}</option>`).join('')}</select></div><div class="grid two">${filtered.map(r=>`<div class="card"><div class="recipe-meta"><span class="pill">${escapeHtml(r.category)}</span><span class="tag">${escapeHtml(projectName(r.projectId))}</span></div><h3 style="margin-top:14px">${escapeHtml(r.name)}</h3><p class="muted small">${escapeHtml(r.goal)}</p><div class="row"><span class="muted small">${db.trials.filter(t=>t.recipeId===r.id).length} essai(s)</span>${btn('Ouvrir','recipe:'+r.id,'primary')}</div></div>`).join('')||'<div class="empty">Aucune recette dans ce projet.</div>'}</div>`}
function recipe(){const r=db.recipes.find(x=>x.id===selectedRecipe);if(!r)return recipes();const trials=db.trials.filter(t=>t.recipeId===r.id).sort((a,b)=>b.createdAt.localeCompare(a.createdAt));return `<button class="back" data-action="nav:recipes">← Retour aux recettes</button>`+header(escapeHtml(projectName(r.projectId)),r.name,r.goal,btn('Modifier','editRecipe:'+r.id))+`<div class="focus"><div class="grid two"><div class="card"><h2>Ingrédients du lot</h2>${r.formulation?formulationDetails(r.formulation):''}<p style="white-space:pre-line">${escapeHtml(r.ingredients)}</p></div><div class="card"><h2>Mesures à relever</h2><p style="white-space:pre-line">${escapeHtml(r.measures)}</p><h3>Variantes</h3><p style="white-space:pre-line">${escapeHtml(r.variants)}</p></div></div>${timesDetails(r.estimatedMinutes)}<div class="card section"><h2>Procédure de référence</h2>${r.steps.map((s,i)=>`<div class="check"><span class="pill">${i+1}</span><span>${escapeHtml(s)}</span></div>`).join('')}</div><div class="buttons">${btn('+ Démarrer un essai','newTrial:'+r.id,'primary')}${btn('Dupliquer la recette','duplicate:'+r.id)}</div><div class="section"><h2>Essais précédents</h2>${trials.length?`<div class="list">${trials.map(t=>`<div class="item"><div><strong>${escapeHtml(t.version)} · ${fmtDate(t.date)}</strong><div class="muted small">${escapeHtml(verdictLabel(t.status))} · ${escapeHtml((t.observations||'').slice(0,90))}</div></div>${btn('Ouvrir','trial:'+t.id)}</div>`).join('')}</div>`:'<div class="empty">Aucun essai enregistré pour cette recette.</div>'}</div></div>`}
function newTrial(recipeId){
 const r=db.recipes.find(x=>x.id===recipeId);if(!r)return;
 trialDraft=makeTrialFromRecipe(r,'V'+(db.trials.filter(t=>t.recipeId===recipeId).length+1));selectedRecipe=recipeId;view='trialForm';render();
}
function formTrial(){const t=trialDraft,r=db.recipes.find(x=>x.id===t.recipeId);if(!t||!r)return home();const sc=Object.keys(t.scores);const avg=(sc.reduce((a,k)=>a+Number(t.scores[k]||0),0)/sc.length).toFixed(1);return `<button class="back" data-action="${t.planContext?'openPlan:'+t.planContext.planId:'recipe:'+r.id}">${t.planContext?'← Plan de test':'← Fiche recette'}</button>`+header('NOUVEL ESSAI',t.snapshot.name,'Les données sont enregistrées lorsque tu appuies sur « Enregistrer l’essai ».')+`<div class="focus">${batchEditor()}<div class="card"><div class="grid two"><div class="field"><label>Version</label><input id="t_version" value="${escapeHtml(t.version)}"></div><div class="field"><label>Date</label><input type="date" id="t_date" value="${escapeHtml(t.date)}"></div></div><div class="field"><label>Modification par rapport à la référence</label><textarea id="t_change" placeholder="Une variable à la fois…">${escapeHtml(t.change)}</textarea></div><h3>Étapes à cocher</h3><div class="steps-progress" id="stepProgress">${t.checked.length}/${t.snapshot.steps.length} réalisées</div>${t.snapshot.steps.map((s,i)=>`<label class="check"><input type="checkbox" class="stepCheck" value="${i}" ${t.checked.includes(i)?'checked':''}><span>${i+1}. ${escapeHtml(s)}</span></label>`).join('')}</div><div class="card section"><h2>Journal de l'essai</h2>${voiceField('t_measurements','Mesures et paramètres',t.measurements,'Temps, températures, quantités, marque…')}${voiceField('t_observations','Observations de dégustation',t.observations,'Dicte librement tes impressions, défauts et points forts…')}<div class="help">Le bouton 🎙 utilise la reconnaissance vocale du navigateur si disponible. Sinon, utilise le microphone du clavier Android. Les deux méthodes produisent du texte modifiable.</div></div>${durationEditor('t',t.estimatedMinutes)}<div class="card section"><h2>Évaluation</h2>${trialKeys.slice(0,5).map((key,i)=>scoreRow(key,trialNames[i],t.scores[key])).join('')}<label class="check"><input type="checkbox" id="wineTested" ${t.wineTested?'checked':''}> Accord vin réellement testé</label><div id="wineScore" ${t.wineTested?'':'class="hidden"'}>${scoreRow('wine','Accord vin',t.scores.wine??5)}</div><div class="row"><strong>Moyenne indicative</strong><strong id="avgScore">${avg}/10</strong></div></div><div class="card section"><div class="field"><label>Verdict</label><select id="t_status"><option value="to_improve" ${t.status==='to_improve'?'selected':''}>À améliorer</option><option value="validated" ${t.status==='validated'?'selected':''}>Validé</option><option value="rejected" ${t.status==='rejected'?'selected':''}>Rejeté</option></select></div><div class="field"><label>Prochaine modification à tester</label><textarea id="t_next" placeholder="Quelle hypothèse vérifier dans V suivante ?">${escapeHtml(t.next)}</textarea></div><div class="buttons">${btn('Enregistrer l’essai','saveTrial','primary')}${btn('Annuler',t.planContext?'openPlan:'+t.planContext.planId:'recipe:'+r.id)}</div></div></div>`}
function voiceField(id,label,value,placeholder){return `<div class="field"><label>${label}</label><textarea id="${id}" placeholder="${placeholder}">${escapeHtml(value||'')}</textarea><div>${btn('🎙 Dicter','voice:'+id,'mic')}</div></div>`}function scoreRow(key,label,value){return `<div class="score"><label for="score_${key}">${label}</label><input id="score_${key}" class="scoreRange" data-score="${key}" type="range" min="0" max="10" step="0.5" value="${value??5}"><strong id="value_${key}">${value??5}</strong></div>`}
function gatherTrial(){if(!trialDraft)return;gatherBatch();trialDraft.estimatedMinutes=gatherTimes('t');for(const k of ['version','date','change','measurements','observations','next','status']){const el=$('#t_'+k);if(el)trialDraft[k]=el.value}trialDraft.checked=[...document.querySelectorAll('.stepCheck:checked')].map(x=>Number(x.value));trialDraft.wineTested=!!$('#wineTested')?.checked;trialDraft.scores={};document.querySelectorAll('.scoreRange').forEach(el=>{if(el.dataset.score!=='wine'||trialDraft.wineTested)trialDraft.scores[el.dataset.score]=Number(el.value)})}
function trialView(){const t=db.trials.find(x=>x.id===selectedTrial);if(!t)return history();const scores=Object.entries(t.scores||{});const avg=scores.length?(scores.reduce((a,[,v])=>a+Number(v),0)/scores.length).toFixed(1):'—';return `<button class="back" data-action="nav:history">← Historique</button>`+header('ESSAI ARCHIVÉ',t.snapshot?.name||recipeName(t.recipeId),`${fmtDate(t.date)} · ${t.version}`)+`<div class="focus">${t.batch?`<section class="card section"><h2>Quantités de l’essai</h2><p class="help">Cible : ${escapeHtml(formatQuantity(t.batch.targetYield.quantity)+' '+t.batch.targetYield.unit)} · Facteur : ×${escapeHtml(formatQuantity(calculateBatch(t.snapshot.formulation,t.batch).factor))}</p>${ingredientList(calculateBatch(t.snapshot.formulation,t.batch).ingredients)}</section>`:legacyIngredientsSection(t)}${t.planContext?`<div class="help"><strong>Plan de test :</strong> ${escapeHtml(t.planContext.planName)} · ${escapeHtml(t.planContext.preparationName)}<div>${btn('Retour au plan','openPlan:'+t.planContext.planId)}</div></div>`:''}${timesDetails(t.estimatedMinutes)}<div class="grid two"><div class="card"><div class="muted small">Note indicative</div><div class="stat">${avg}/10</div><span class="pill ${t.status==='to_improve'?'warn':''}">${escapeHtml(verdictLabel(t.status))}</span></div><div class="card"><h3>Variable testée</h3><p>${escapeHtml(t.change||'Aucune renseignée')}</p></div></div><div class="card section"><h2>Mesures</h2><p style="white-space:pre-wrap">${escapeHtml(t.measurements||'—')}</p><h2>Observations</h2><p style="white-space:pre-wrap">${escapeHtml(t.observations||'—')}</p><h3>Prochaine modification</h3><p>${escapeHtml(t.next||'—')}</p></div><div class="card section"><h2>Notes détaillées</h2>${Object.entries(t.scores||{}).map(([k,v])=>`<div class="row" style="padding:8px 0"><span>${escapeHtml(trialNames[trialKeys.indexOf(k)]||k)}</span><strong>${Number(v)}/10</strong></div><div class="bar"><span style="width:${Math.max(0,Math.min(100,Number(v)*10))}%"></span></div>`).join('')}</div><div class="buttons">${btn('Copier le compte rendu','copyTrial:'+t.id)}${btn('Nouvel essai depuis la référence','newTrial:'+t.recipeId,'primary')}${btn('Supprimer cet essai','deleteTrial:'+t.id,'danger')}</div></div>`}
function history(){const sorted=[...db.trials].sort((a,b)=>b.createdAt.localeCompare(a.createdAt));return header('HISTORIQUE','Comparer les essais','Versions enregistrées et résultats, sans écraser les recettes de référence.')+`<div class="field" style="max-width:450px"><label>Recette à comparer</label><select id="historyRecipe"><option value="all">Toutes les recettes</option>${db.recipes.map(r=>`<option value="${r.id}" ${selectedRecipe===r.id?'selected':''}>${escapeHtml(r.name)}</option>`).join('')}</select></div>${(()=>{const f=sorted.filter(t=>!selectedRecipe||t.recipeId===selectedRecipe);return f.length?`<div class="card compare"><table><thead><tr><th>Recette</th><th>Version</th><th>Date</th><th>Goût</th><th>Texture</th><th>Faisabilité</th><th>Verdict</th><th></th></tr></thead><tbody>${f.map(t=>`<tr><td>${escapeHtml(recipeName(t.recipeId))}</td><td>${escapeHtml(t.version)}</td><td>${fmtDate(t.date)}</td><td>${t.scores?.taste??'—'}</td><td>${t.scores?.texture??'—'}</td><td>${t.scores?.feasibility??'—'}</td><td>${escapeHtml(verdictLabel(t.status))}</td><td>${btn('Voir','trial:'+t.id)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Aucun essai enregistré pour cette sélection.</div>'})()}`}
function backups(){return header('DONNÉES','Sauvegardes et exports','Conservez vos essais indépendamment du navigateur.')+`<div class="focus"><div class="card"><h2>Exporter</h2><p class="muted small">Le JSON contient tous les projets, recettes et essais. Le Markdown facilite l'analyse dans ChatGPT.</p><div class="buttons">${btn('↓ Sauvegarde JSON','exportJson','primary')}${btn('↓ Compte rendu Markdown','exportMd')}</div></div><div class="card section"><h2>Importer une sauvegarde</h2><p class="muted small">Une importation remplace toutes les données locales actuelles. Exportez d'abord votre sauvegarde.</p><input type="file" id="importFile" accept=".json,application/json"><div style="margin-top:12px">${btn('Importer le JSON','importJson')}</div></div><div class="card section"><h2>Confidentialité et limites</h2><p class="small">Les données sont conservées dans le stockage local de ce navigateur, sans compte ni serveur. Elles peuvent disparaître si les données du navigateur sont effacées. La dictée via le navigateur ou le clavier peut utiliser un service de reconnaissance vocale tiers : vérifiez les réglages de confidentialité de votre appareil.</p><p class="small">Pour l'installation hors ligne, ouvrez cette application via HTTPS ou localhost. L'ouverture directe du fichier HTML fonctionne pour la plupart des fonctions, mais pas nécessairement pour l'installation PWA ni la reconnaissance vocale.</p></div></div>`}
function newRecipe(existing=null){recipeDraft=existing?JSON.parse(JSON.stringify(existing)):{id:uid(),projectId:db.projects[0]?.id||'',name:'',category:'Autre',goal:'',ingredients:'',steps:[''],measures:'',variants:'',createdAt:today()};view='recipeForm';render()}
function recipeForm(){
 const r=recipeDraft;if(!r)return recipes();
 return header('ÉDITEUR DE RECETTE',r.name||'Nouvelle recette','La référence reste indépendante des essais archivés.')+`<div class="focus"><section class="card"><div class="field"><label for="r_name">Nom de la recette</label><input id="r_name" value="${escapeHtml(r.name)}" required></div><div class="grid two"><div class="field"><label for="r_projectId">Projet</label><select id="r_projectId">${db.projects.map(p=>`<option value="${p.id}" ${p.id===r.projectId?'selected':''}>${escapeHtml(p.name)}</option>`).join('')}</select></div><div class="field"><label for="r_category">Catégorie</label><select id="r_category">${['Apéritif','Entrée','Plat','Dessert','Autre'].map(c=>`<option ${r.category===c?'selected':''}>${c}</option>`).join('')}</select></div></div><div class="field"><label for="r_goal">Objectif gustatif</label><textarea id="r_goal">${escapeHtml(r.goal)}</textarea></div></section><section class="card section" id="recipeFormulation">${formulationEditor()}</section>${durationEditor('r',r.estimatedMinutes)}<section class="card section"><div class="field"><label for="r_ingredients">Ingrédients — liste libre / notes d’origine</label><textarea id="r_ingredients" style="min-height:145px">${escapeHtml(r.ingredients)}</textarea></div><div class="field"><label for="r_steps">Étapes (une ligne par étape)</label><textarea id="r_steps" style="min-height:175px">${escapeHtml(r.steps.join('\n'))}</textarea></div><div class="field"><label for="r_measures">Mesures à relever</label><textarea id="r_measures">${escapeHtml(r.measures)}</textarea></div><div class="field"><label for="r_variants">Variantes à tester</label><textarea id="r_variants">${escapeHtml(r.variants)}</textarea></div></section><div class="buttons form-actions">${btn('Enregistrer la recette','saveRecipe','primary')}${btn('Annuler','nav:recipes')}</div></div>`;
}
function render(){showStorageWarning();nav();$('#root').innerHTML=({home,recipes,recipe,trialForm:formTrial,trialView,history,backup:backups,recipeForm,conversion:conversionView,plans:plansView,plan:planView,planInfo:planInfoForm,planVariant:planVariantForm,planPreparation:preparationForm,planTasting:tastingForm,planCompare:planCompareView,dessertSetup:dessertSetupView,dessertPreview:dessertPreviewView}[view]||home)();document.querySelectorAll('.field').forEach(field=>{const label=field.querySelector('label'),control=field.querySelector('input,textarea,select');if(label&&control?.id)label.htmlFor=control.id});if(view==='trialForm'&&trialDraft?.batch)updateBatchDisplay();window.scrollTo(0,0)}
function download(filename,content,type){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function report(t){
 let details='';
 if(t.planContext)details+='\nPlan de test : '+t.planContext.planName+'\nPréparation : '+t.planContext.preparationName+'\nRéférence du plan : '+t.planContext.referenceName+'\n';

 if(t.batch&&t.snapshot?.formulation){
  const form=t.snapshot.formulation,result=calculateBatch(form,t.batch);
  details+=`\nRendement de référence : ${formatQuantity(form.yield.quantity)} ${form.yield.unit}\nRendement cible : ${formatQuantity(t.batch.targetYield.quantity)} ${t.batch.targetYield.unit}\nFacteur : ×${formatQuantity(result.factor)}\n\nIngrédients de l’essai :\n`+result.ingredients.map(line=>`- ${ingredientQuantity(line)} — ${line.name}${line.adjusted?' (Ajusté manuellement)':''}${line.note?' — '+line.note:''}`).join('\n')+'\n';
 }
 if(t.snapshot?.ingredients)details+='\nNotes et liste d’origine :\n'+t.snapshot.ingredients+'\n';
 if(t.estimatedMinutes)details+='\nTemps estimés : '+timeSummary(t.estimatedMinutes)+'\n'+TIME_KEYS.filter(k=>k!=='total').map(k=>`${TIME_LABELS[k]} : ${formatMinutes(t.estimatedMinutes[k])}`).join('\n')+'\n';
 return `# ${t.snapshot?.name||recipeName(t.recipeId)} — ${t.version}\nDate : ${t.date}\n${details}\nModification : ${t.change||'Aucune'}\nMesures : ${t.measurements||'Non renseignées'}\nObservations : ${t.observations||'Non renseignées'}\n${Object.entries(t.scores||{}).map(([k,v])=>`${trialNames[trialKeys.indexOf(k)]||k} : ${v}/10`).join('\n')}\nVerdict : ${verdictLabel(t.status)}\nProchain essai : ${t.next||'À définir'}\n`;
}
function act(a){const [verb,...rest]=a.split(':'),id=rest.join(':');if(handlePlanAction(verb,id))return;if(verb==='nav'){view=id;selectedRecipe=null;render()}else if(verb==='project'){activeProject=id;view='recipes';render()}else if(verb==='newProject'){const name=prompt('Nom du projet :');if(name?.trim()){const next=JSON.parse(JSON.stringify(db));next.projects.push({id:uid(),name:name.trim(),description:'',createdAt:today()});if(!save(next))return;render()}}else if(verb==='reviewConversion'){conversionDraft=proposeConversion(db);view='conversion';render()}else if(verb==='applyConversion'){applyConversion()}else if(verb==='newRecipe')newRecipe();else if(verb==='editRecipe')newRecipe(db.recipes.find(r=>r.id===id));else if(verb==='recipe'){selectedRecipe=id;view='recipe';render()}else if(verb==='newTrial')newTrial(id);else if(verb==='trial'){selectedTrial=id;view='trialView';render()}else if(['enableFormulation','addIngredient','removeIngredient'].includes(verb)){changeFormulation(verb,id)}else if(verb==='resetAdjustment'){gatherBatch(id);clearFormErrors();updateBatchDisplay()}else if(verb==='saveRecipe'){clearFormErrors();const r=recipeDraft;captureFormulation(true);r.estimatedMinutes=gatherTimes('r');for(const k of ['name','projectId','category','goal','ingredients','measures','variants'])r[k]=$('#r_'+k).value;r.steps=$('#r_steps').value.split('\n').map(s=>s.trim()).filter(Boolean);if(!db.projects.some(p=>p.id===r.projectId)){toast('Créez un projet depuis l’accueil, puis choisissez-le pour la recette.');return}if(!r.name.trim()||!r.steps.length){toast('Renseigne le nom et au moins une étape.');return}const next=JSON.parse(JSON.stringify(db)),ix=next.recipes.findIndex(x=>x.id===r.id);if(ix>=0)next.recipes[ix]=r;else next.recipes.push(r);if(!save(next))return;selectedRecipe=r.id;view='recipe';render();toast('Recette enregistrée')}else if(verb==='duplicate'){const r=db.recipes.find(x=>x.id===id);if(r){const copy={...JSON.parse(JSON.stringify(r)),id:uid(),name:r.name+' — copie',createdAt:today()};newRecipe(copy)}}else if(verb==='saveTrial'){gatherTrial();if(!trialDraft.date||Number.isNaN(Date.parse(trialDraft.date))){toast('Renseignez une date valide pour cet essai.');return}if(!trialDraft.version.trim()){toast('Indique une version.');return}if(!commitTrial(trialDraft))return;selectedTrial=trialDraft.id;trialDraft=null;view='trialView';render();toast('Essai enregistré sur cet appareil')}else if(verb==='deleteTrial'){assertTrialDeletable(db,id);if(confirm('Supprimer définitivement cet essai ?')){const next={...db,trials:db.trials.filter(t=>t.id!==id)};if(!save(next))return;view='history';selectedRecipe=null;render()}}else if(verb==='copyTrial'){const t=db.trials.find(x=>x.id===id);navigator.clipboard?.writeText(report(t)).then(()=>toast('Compte rendu copié')).catch(()=>{download('essai-'+t.version+'.md',report(t),'text/markdown');toast('Compte rendu téléchargé')})}else if(verb==='exportRaw'){if(rawStorage!==null)download('atelier-saveurs-recuperation.txt',rawStorage,'text/plain')}else if(verb==='exportJson'){download('atelier-saveurs-sauvegarde-'+today()+'.json',JSON.stringify(db,null,2),'application/json');toast('Sauvegarde exportée')}else if(verb==='exportMd'){const md='# Carnet culinaire — '+today()+'\n\n'+db.recipes.map(r=>`## ${r.name}\n\n${db.trials.filter(t=>t.recipeId===r.id).map(report).join('\n---\n')||'Aucun essai.'}`).join('\n\n')+'\n\n'+plansOf(db).map(p=>planReport(p,db)).join('\n\n');download('atelier-saveurs-essais-'+today()+'.md',md,'text/markdown');toast('Rapport exporté')}else if(verb==='importJson'){const f=$('#importFile')?.files?.[0];if(!f){toast('Sélectionne un fichier JSON.');return}f.text().then(txt=>{let d;try{d=JSON.parse(txt)}catch{throw Error('JSON invalide')}validateData(d);if(confirm('Remplacer toutes les données locales par cette sauvegarde ?')){if(!save(d))return;selectedRecipe=null;view='home';render();toast('Sauvegarde restaurée')}}).catch(e=>toast(e.message))}else if(verb==='voice'){voice(id)}}
let recognition=null,voiceTarget=null;function voice(id){const Speech=window.SpeechRecognition||window.webkitSpeechRecognition;if(!Speech){toast('Reconnaissance vocale indisponible ici. Utilise le micro du clavier Android.');$('#'+id)?.focus();return}if(recognition){recognition.stop();recognition=null;document.querySelectorAll('.mic').forEach(b=>b.classList.remove('recording'));return}const target=$('#'+id);if(!target)return;recognition=new Speech();voiceTarget=id;recognition.lang='fr-FR';recognition.continuous=true;recognition.interimResults=false;const rec=recognition;rec.onresult=e=>{let words='';for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)words+=e.results[i][0].transcript+' ';target.value+=(target.value.trim()?' ':'')+words;target.dispatchEvent(new Event('input',{bubbles:true}))};rec.onerror=e=>toast('Dictée interrompue : '+e.error);rec.onend=()=>{recognition=null;document.querySelectorAll('.mic').forEach(b=>b.classList.remove('recording'))};try{rec.start();document.querySelectorAll('.mic').forEach(b=>{if(b.dataset.action==='voice:'+id)b.classList.add('recording')});toast('Dictée en cours. Appuie de nouveau sur 🎙 pour arrêter.')}catch(e){recognition=null;toast('Microphone indisponible : utilise le clavier Android.')}}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el){e.preventDefault();try{act(el.dataset.action)}catch(error){showFormError(error)}}});document.addEventListener('change',e=>{if(view==='trialForm'&&trialDraft?.batch&&(e.target.id.startsWith('t_yield_')||e.target.id.startsWith('t_adjust_'))){try{batchChange(e.target)}catch(error){showFormError(error)}return}if(e.target.id==='variant_included')$('#variant_details').classList.toggle('hidden',!e.target.checked);if(e.target.id==='projectFilter'){activeProject=e.target.value;render()}if(e.target.id==='historyRecipe'){selectedRecipe=e.target.value==='all'?null:e.target.value;render()}if(e.target.id==='wineTested'){$('#wineScore').classList.toggle('hidden',!e.target.checked);updateAverage()}if(e.target.classList.contains('stepCheck')){$('#stepProgress').textContent=document.querySelectorAll('.stepCheck:checked').length+'/'+document.querySelectorAll('.stepCheck').length+' réalisées'}});function updateAverage(){let scores=[...document.querySelectorAll('.scoreRange')].filter(el=>el.dataset.score!=='wine'||$('#wineTested')?.checked);let avg=scores.reduce((s,el)=>s+Number(el.value),0)/scores.length;const el=$('#avgScore');if(el)el.textContent=avg.toFixed(1)+'/10'}document.addEventListener('input',e=>{if(e.target.id.startsWith('t_adjust_'))e.target.dataset.dirty='true';if(e.target.classList.contains('scoreRange')){$('#value_'+e.target.dataset.score).textContent=e.target.value;updateAverage()}});if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(()=>{});render();
</script></body></html>
